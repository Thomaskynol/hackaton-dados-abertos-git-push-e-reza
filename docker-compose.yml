services:
  mongo:
    image: mongo:7
    container_name: agropilot-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    # ponytail: sem auth no dev local; backend/front entram aqui no merge
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: python:3.12-slim
    container_name: agropilot-api
    working_dir: /app
    volumes:
      - ./back:/app
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - CORS_ORIGINS=*
      # Ex.: OPENROUTER_API_KEY=sk-or-v1-... (nunca commitar a chave real)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - mongo

volumes:
  mongo_data:
