services:
  mongo:
    image: mongo:7
    container_name: agropilot-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    # ponytail: no auth in local dev; backend/front join here
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: python:3.12-slim
    container_name: agropilot-api
    working_dir: /app
    volumes:
      - ./back:/app:z
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - CORS_ORIGINS=*
      # E.g.: OPENROUTER_API_KEY=sk-or-v1-... (never commit the real key)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # IA (opcionais): modelo(s) free-first e timeout da IA nos endpoints de dados
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - IA_TIMEOUT_DADOS=${IA_TIMEOUT_DADOS:-12}
      # série de preços viva (IBGE)
      - IBGE_AUTO_UPDATE=${IBGE_AUTO_UPDATE:-1}
      - IBGE_TTL_DIAS=${IBGE_TTL_DIAS:-7}
      # previsão de preço
      - PRECO_PREVISAO_IA=${PRECO_PREVISAO_IA:-1}
      - PRECO_PREVISAO_TTL_DIAS=${PRECO_PREVISAO_TTL_DIAS:-30}
      - PRECO_ANO_ALVO_OFFSET=${PRECO_ANO_ALVO_OFFSET:-2}
      # clima real (Open-Meteo)
      - CLIMA_AUTO=${CLIMA_AUTO:-1}
    # ponytail: install deps at start; without this uvicorn exits and only mongo stays up
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  front:
    image: node:20-slim
    container_name: agropilot-front
    working_dir: /front
    volumes:
      - ./front:/front:z
      - /front/node_modules
      - /front/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - AGROPILOT_API_URL=http://localhost:8000
    # ponytail: install at start so no node_modules commit; build+start prod, fallback dev
    command: sh -c "npm install && (npm run build && npm start -- -p 3000 -H 0.0.0.0 || npm run dev -- -p 3000 -H 0.0.0.0)"
    depends_on:
      api:
        condition: service_healthy

  seed:
    image: mongo:7
    container_name: agropilot-seed
    volumes:
      - ./seed:/seed:z
    environment:
      - SEED_URL=${SEED_URL:-https://github.com/Thomaskynol/hackaton-dados-abertos-sql-injection/releases/download/data/agropilot.gz}
    # ponytail: one-shot; baixa asset só se ausente, restaura só se vazio, sai 0
    command: >
      bash -c "
        set -e;
        if [ ! -s /seed/agropilot.gz ]; then
          apt-get update -qq && apt-get install -y -qq curl >/dev/null &&
          curl -fL -o /seed/agropilot.gz \"$$SEED_URL\";
        fi;
        COUNT=$$(mongosh --quiet --host mongo --eval 'try { print(db.getSiblingDB(\"agropilot\").stats().objects) } catch (e) { print(0) }' | tr -cd '0-9');
        if [ \"$${COUNT:-0}\" -gt 0 ]; then echo \"SKIP: agropilot already has $$COUNT objects\"; exit 0; fi;
        mongorestore --host mongo --gzip --archive=/seed/agropilot.gz;
        echo RESTORED;
      "
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

volumes:
  mongo_data:
