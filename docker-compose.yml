services:
  mongo:
    image: mongo:7
    container_name: agropilot-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    # ponytail: sem auth no dev local; backend/front entram aqui no merge
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: python:3.12-slim
    container_name: agropilot-api
    working_dir: /app
    volumes:
      - ./back:/app:z
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - CORS_ORIGINS=*
      # Ex.: OPENROUTER_API_KEY=sk-or-v1-... (nunca commitar a chave real)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    # ponytail: install deps at start; without this uvicorn exits and only mongo stays up
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: python:3.12-slim
    container_name: agropilot-web
    working_dir: /site
    volumes:
      - ./index.html:/site/index.html:ro,z
      - ./scripts:/site/scripts:ro,z
      - ./styles:/site/styles:ro,z
      - ./hackathon:/site/hackathon:ro,z
    ports:
      - "8080:8080"
    environment:
      # Browser-side wiring: front reads window.AGROPILOT_API_URL, falls back to http://localhost:8000 (see scripts/api.js)
      - AGROPILOT_API_URL=http://localhost:8000
    # ponytail: stdlib http.server, no new deps; serves existing static files only
    command: python -m http.server 8080
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
