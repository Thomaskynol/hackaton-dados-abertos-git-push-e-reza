<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroPilot 24/7 — Seu Copiloto Agrícola</title>
  <meta name="description" content="Acesse ou cadastre-se no AgroPilot, o consultor 24/7 para o pequeno produtor rural.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <!-- Fundo animado -->
  <div class="bg-layer">
    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>
    <div class="bg-orb orb3"></div>
    <div class="particles" id="particles"></div>
  </div>

  <main class="login-shell">

    <!-- ── Logo / Branding ── -->
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="22" stroke="url(#g1)" stroke-width="2.5"/>
          <circle cx="24" cy="24" r="14" stroke="url(#g1)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
          <path d="M24 8 C24 8 16 16 16 24 C16 32 24 40 24 40" stroke="url(#g2)" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M24 8 C24 8 32 16 32 24 C32 32 24 40 24 40" stroke="url(#g2)" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="24" cy="24" r="4" fill="url(#g1)"/>
          <defs>
            <linearGradient id="g1" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#4ade80"/>
              <stop offset="100%" stop-color="#22d3ee"/>
            </linearGradient>
            <linearGradient id="g2" x1="16" y1="8" x2="32" y2="40" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#86efac"/>
              <stop offset="100%" stop-color="#67e8f9"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">AgroPilot</span>
        <span class="brand-tagline">Copiloto Agrícola 24/7</span>
      </div>
    </div>

    <!-- ── Card de Acesso ── -->
    <div class="auth-card" id="auth-card">

      <!-- Tabs: Entrar / Cadastrar -->
      <div class="tab-bar" role="tablist">
        <button class="tab-btn active" id="tab-login" role="tab" aria-selected="true" aria-controls="panel-login" onclick="switchTab('login')">
          Entrar
        </button>
        <button class="tab-btn" id="tab-register" role="tab" aria-selected="false" aria-controls="panel-register" onclick="switchTab('register')">
          Cadastrar
        </button>
        <div class="tab-slider" id="tab-slider"></div>
      </div>

      <!-- ── Painel: Entrar ── -->
      <div class="tab-panel active" id="panel-login" role="tabpanel">
        <h1 class="panel-title">Bem-vindo de volta</h1>
        <p class="panel-sub">Use seu telefone para acessar rapidamente</p>

        <form id="form-login" class="auth-form" novalidate>
          <div class="field-group">
            <label for="login-phone" class="field-label">Telefone</label>
            <div class="field-wrap">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 8.91a16 16 0 0 0 6 6l.86-.86a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
              </span>
              <input
                type="tel"
                id="login-phone"
                name="phone"
                class="field-input"
                placeholder="(62) 99999-9999"
                autocomplete="tel"
                inputmode="tel"
                required
              >
            </div>
            <span class="field-error" id="login-phone-error"></span>
          </div>

          <button type="submit" class="btn-primary" id="btn-login">
            <span class="btn-text">Entrar no AgroPilot</span>
            <span class="btn-spinner hidden" aria-hidden="true"></span>
          </button>
        </form>

        <p class="switch-hint">
          Ainda não tem conta?
          <button class="link-btn" onclick="switchTab('register')">Cadastre-se grátis</button>
        </p>
      </div>

      <!-- ── Painel: Cadastrar ── -->
      <div class="tab-panel" id="panel-register" role="tabpanel">
        <h1 class="panel-title">Começar é simples</h1>
        <p class="panel-sub">Só precisamos do seu nome e telefone</p>

        <!-- Indicador de progresso do onboarding -->
        <div class="onboarding-progress" id="onboarding-progress">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p class="progress-label" id="progress-label">Passo 1 de 4</p>

        <!-- Formulário de cadastro inicial -->
        <div id="register-step-1" class="onboarding-step active">
          <form id="form-register" class="auth-form" novalidate>
            <div class="field-group">
              <label for="reg-name" class="field-label">Como você se chama?</label>
              <div class="field-wrap">
                <span class="field-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                  </svg>
                </span>
                <input type="text" id="reg-name" name="name" class="field-input" placeholder="Ex: Antônio" autocomplete="given-name" required>
              </div>
              <span class="field-error" id="reg-name-error"></span>
            </div>

            <div class="field-group">
              <label for="reg-phone" class="field-label">Seu telefone (WhatsApp)</label>
              <div class="field-wrap">
                <span class="field-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 8.91a16 16 0 0 0 6 6l.86-.86a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                  </svg>
                </span>
                <input type="tel" id="reg-phone" name="phone" class="field-input" placeholder="(62) 99999-9999" autocomplete="tel" inputmode="tel" required>
              </div>
              <span class="field-error" id="reg-phone-error"></span>
            </div>

            <button type="submit" class="btn-primary" id="btn-register">
              <span class="btn-text">Continuar</span>
              <span class="btn-spinner hidden" aria-hidden="true"></span>
            </button>
          </form>
        </div>

        <!-- Conversa guiada de onboarding -->
        <div id="register-step-onboarding" class="onboarding-step">
          <div class="chat-onboard" id="chat-onboard" role="log" aria-live="polite">
            <!-- mensagens do copiloto aparecem aqui -->
          </div>
          <div class="onboard-input-row">
            <input
              type="text"
              id="onboard-answer"
              class="field-input"
              placeholder="Digite sua resposta..."
              autocomplete="off"
            >
            <button class="btn-send" id="btn-onboard-send" aria-label="Enviar resposta">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
        </div>

        <p class="switch-hint" id="register-switch-hint">
          Já tem conta?
          <button class="link-btn" onclick="switchTab('login')">Entrar</button>
        </p>
      </div>
    </div>

    <!-- ── Rodapé ── -->
    <footer class="login-footer">
      <p>Dados de fontes abertas: <strong>ZARC/MAPA</strong> · <strong>Embrapa</strong> · <strong>INMET</strong> · <strong>Agrofit</strong></p>
    </footer>

  </main>

  <script src="login.js"></script>
</body>
</html>
